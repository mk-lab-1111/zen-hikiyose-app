<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#D4AF37">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MINDFUL ASSET">
  <meta name="description" content="脳科学×引き寄せ。現世利益を掴み取るマインド資産運用アプリ。">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <title>MINDFUL ASSET</title>
  <link rel="stylesheet" href="css/zen_hikiyose_theme.css">
  <link rel="stylesheet" href="css/zen_hikiyose_base.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100dvh; }
  </style>
</head>
<body>
  <script>
    (function() {
      // テーマ即時適用（FOUC防止）
      try {
        const theme = JSON.parse(localStorage.getItem('zen_hikiyose_theme'));
        if (theme && theme !== 'default') {
          document.documentElement.setAttribute('data-theme', theme);
        }
      } catch(e) {}

      // オンボーディング判定
      try {
        const ob = JSON.parse(localStorage.getItem('zen_hikiyose_onboarding'));
        if (ob && ob.completed) {
          window.location.replace('pages/zen_hikiyose_home.html');
        } else {
          window.location.replace('pages/zen_hikiyose_onboarding.html');
        }
      } catch(e) {
        window.location.replace('pages/zen_hikiyose_onboarding.html');
      }
    })();
  </script>
  <noscript>
    <p style="color:#F0F0F0;font-family:sans-serif;text-align:center;">
      このアプリにはJavaScriptが必要です。ブラウザの設定を確認してください。
    </p>
  </noscript>
</body>
</html>
