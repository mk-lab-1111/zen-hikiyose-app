<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#D4AF37">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>MINDFUL ASSET - ホーム</title>
  <link rel="stylesheet" href="../css/zen_hikiyose_theme.css">
  <link rel="stylesheet" href="../css/zen_hikiyose_base.css">
  <link rel="stylesheet" href="../css/zen_hikiyose_components.css">
</head>
<body>
  <div id="app">
    <header class="page-header">
      <span class="page-header-title">MINDFUL ASSET</span>
      <div class="score-circle" style="width:48px;height:48px;">
        <span class="score-value" style="font-size:1rem;" id="score-val">—</span>
        <span class="score-label">SCORE</span>
      </div>
    </header>

    <main class="main-content">
      <div class="card card-premium mb-16" style="text-align:center;padding:24px 16px;">
        <p class="text-muted text-xs mb-8">TODAY'S QUOTE</p>
        <p style="font-size:1.1rem;font-weight:700;color:var(--color-accent);line-height:1.5;">
          "あなたの思考が現実を創る"
        </p>
      </div>

      <div class="section">
        <p class="section-title">TODAY'S ADVICE</p>
        <div class="card" id="daily-advice"><div class="spinner"></div></div>
      </div>

      <div class="section">
        <p class="section-title">QUICK ACTION</p>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
          <a href="zen_hikiyose_record.html" class="card card-clickable" style="text-align:center;padding:20px 12px;">
            <div style="font-size:28px;margin-bottom:8px;">✍️</div>
            <div style="font-size:0.8rem;font-weight:500;">今日を記録</div>
            <span class="badge badge-free" style="margin-top:8px;">FREE</span>
          </a>
          <a href="zen_hikiyose_affirmation.html" class="card card-clickable" style="text-align:center;padding:20px 12px;">
            <div style="font-size:28px;margin-bottom:8px;">🔥</div>
            <div style="font-size:0.8rem;font-weight:500;">アファメーション</div>
            <span class="badge badge-free" style="margin-top:8px;">FREE</span>
          </a>
          <a href="zen_hikiyose_dream_log.html" class="card card-clickable" style="text-align:center;padding:20px 12px;">
            <div style="font-size:28px;margin-bottom:8px;">🌙</div>
            <div style="font-size:0.8rem;font-weight:500;">夢日記</div>
            <span class="badge badge-premium" style="margin-top:8px;">PREMIUM</span>
          </a>
          <a href="zen_hikiyose_mandala.html" class="card card-clickable" style="text-align:center;padding:20px 12px;">
            <div style="font-size:28px;margin-bottom:8px;">🎯</div>
            <div style="font-size:0.8rem;font-weight:500;">マンダラ</div>
            <span class="badge badge-premium" style="margin-top:8px;">PREMIUM</span>
          </a>
        </div>
      </div>
    </main>

    <nav class="bottom-nav">
      <a href="zen_hikiyose_home.html" class="bottom-nav-item active">
        <span class="nav-icon">🏠</span><span class="nav-label">ホーム</span>
      </a>
      <a href="zen_hikiyose_affirmation.html" class="bottom-nav-item">
        <span class="nav-icon">🔥</span><span class="nav-label">アファメーション</span>
      </a>
      <a href="zen_hikiyose_log.html" class="bottom-nav-item">
        <span class="nav-icon">📓</span><span class="nav-label">ログ</span>
      </a>
      <a href="zen_hikiyose_roadmap.html" class="bottom-nav-item">
        <span class="nav-icon">🗺️</span><span class="nav-label">マップ</span>
      </a>
      <a href="zen_hikiyose_settings.html" class="bottom-nav-item">
        <span class="nav-icon">⚙️</span><span class="nav-label">設定</span>
      </a>
    </nav>
  </div>

  <script type="module">
    import ZenStorage from '../js/zen_hikiyose_storage.js';
    import ZenScore from '../js/zen_hikiyose_score.js';

    const theme = ZenStorage.get('theme', 'default');
    if (theme && theme !== 'default') document.documentElement.setAttribute('data-theme', theme);

    document.getElementById('score-val').textContent = ZenScore.calculate() || '—';

    fetch('../data/zen_hikiyose_advice.json')
      .then(r => r.json())
      .then(data => {
        const idx = new Date().getDay();
        const a = data.advice[idx === 0 ? 6 : idx - 1] || data.advice[0];
        document.getElementById('daily-advice').innerHTML = `
          <p style="font-size:0.75rem;color:var(--color-accent);font-weight:500;margin-bottom:8px;">${a.title}</p>
          <p style="font-size:0.875rem;color:var(--color-text-secondary);line-height:1.7;">${a.body}</p>
        `;
      })
      .catch(() => { document.getElementById('daily-advice').textContent = '今日も実践を続けましょう。'; });
  </script>
</body>
</html>
