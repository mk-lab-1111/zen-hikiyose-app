<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#D4AF37">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>MINDFUL ASSET - ホーム</title>
  <link rel="stylesheet" href="../css/zen_hikiyose_theme.css">
  <link rel="stylesheet" href="../css/zen_hikiyose_base.css">
  <link rel="stylesheet" href="../css/zen_hikiyose_components.css">
</head>
<body>
<div id="app">

  <!-- ヘッダー -->
  <header class="page-header">
    <span class="page-header__logo">MINDFUL ASSET</span>
    <div class="page-header__right">
      <div class="score-badge" id="score-badge">
        <span class="score-badge__value" id="score-value">0</span>
        <span class="score-badge__label">スコア</span>
      </div>
    </div>
  </header>

  <main class="main-content">

    <!-- 今日のアドバイス -->
    <section class="section">
      <p class="section-title">今日のZENメッセージ</p>
      <div class="card-accent" id="daily-advice">
        <div class="spinner"></div>
      </div>
    </section>

    <!-- 連続実践 -->
    <section class="section">
      <div class="stat-grid">
        <div class="stat-item">
          <div class="stat-value" id="streak-val">0</div>
          <div class="stat-label">日連続</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="total-val">0</div>
          <div class="stat-label">累計実践日</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="score-stat">0</div>
          <div class="stat-label">マインドスコア</div>
        </div>
      </div>
    </section>

    <!-- ショートカット -->
    <section class="section">
      <p class="section-title">今日の実践</p>
      <div style="display:flex;flex-direction:column;gap:var(--sp-3);">
        <a href="zen_hikiyose_affirmation.html?session=morning" class="card card-clickable" style="display:flex;align-items:center;gap:var(--sp-4);">
          <div style="width:44px;height:44px;border-radius:50%;background:var(--color-accent-bg);border:1.5px solid var(--color-border-accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--color-accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"/><path d="M12 2v2M12 20v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M2 12h2M20 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
            </svg>
          </div>
          <div style="flex:1;">
            <div style="font-weight:700;font-size:var(--text-sm);">朝のアファメーション</div>
            <div style="font-size:var(--text-xs);color:var(--color-text-muted);margin-top:2px;" id="morning-status">未実施</div>
          </div>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </a>
        <a href="zen_hikiyose_affirmation.html?session=evening" class="card card-clickable" style="display:flex;align-items:center;gap:var(--sp-4);">
          <div style="width:44px;height:44px;border-radius:50%;background:var(--color-accent-bg);border:1.5px solid var(--color-border-accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--color-accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
          </div>
          <div style="flex:1;">
            <div style="font-weight:700;font-size:var(--text-sm);">夜のアファメーション</div>
            <div style="font-size:var(--text-xs);color:var(--color-text-muted);margin-top:2px;" id="evening-status">未実施</div>
          </div>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </a>
        <a href="zen_hikiyose_moshimo.html" class="card card-clickable" style="display:flex;align-items:center;gap:var(--sp-4);">
          <div style="width:44px;height:44px;border-radius:50%;background:var(--color-accent-bg);border:1.5px solid var(--color-border-accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--color-accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>
            </svg>
          </div>
          <div style="flex:1;">
            <div style="font-weight:700;font-size:var(--text-sm);">もしもボックス</div>
            <div style="font-size:var(--text-xs);color:var(--color-text-muted);margin-top:2px;">シナリオ没入メディテーション</div>
          </div>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </a>
      </div>
    </section>

    <!-- クイックアクション -->
    <section class="section">
      <p class="section-title">記録する</p>
      <div class="grid-2">
        <a href="zen_hikiyose_log.html" class="card card-clickable" style="text-align:center;padding:var(--sp-5) var(--sp-3);">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--color-accent)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin:0 auto var(--sp-2);">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
          </svg>
          <div style="font-weight:500;font-size:var(--text-sm);">引き寄せログ</div>
          <span class="badge badge-free" style="margin-top:6px;">無料</span>
        </a>
        <a href="zen_hikiyose_log.html" class="card card-clickable" style="text-align:center;padding:var(--sp-5) var(--sp-3);">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--color-accent)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin:0 auto var(--sp-2);">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
          </svg>
          <div style="font-weight:500;font-size:var(--text-sm);">夢実現ログ</div>
          <span class="badge badge-premium" style="margin-top:6px;">プレミアム</span>
        </a>
        <a href="zen_hikiyose_mandala.html" class="card card-clickable" style="text-align:center;padding:var(--sp-5) var(--sp-3);">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--color-accent)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin:0 auto var(--sp-2);">
            <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
            <rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
          </svg>
          <div style="font-weight:500;font-size:var(--text-sm);">マンダラマップ</div>
          <span class="badge badge-premium" style="margin-top:6px;">プレミアム</span>
        </a>
        <a href="zen_hikiyose_roadmap.html" class="card card-clickable" style="text-align:center;padding:var(--sp-5) var(--sp-3);">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--color-accent)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin:0 auto var(--sp-2);">
            <polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/>
            <line x1="9" y1="3" x2="9" y2="18"/>
            <line x1="15" y1="6" x2="15" y2="21"/>
          </svg>
          <div style="font-weight:500;font-size:var(--text-sm);">ロードマップ</div>
          <span class="badge badge-free" style="margin-top:6px;">無料</span>
        </a>
      </div>
    </section>

    <!-- ZENについてバナー -->
    <section class="section">
      <a href="zen_hikiyose_about.html" class="card-accent card-clickable" style="display:flex;align-items:center;gap:var(--sp-4);">
        <div style="width:44px;height:44px;border-radius:50%;background:var(--color-accent-bg);border:1.5px solid var(--color-border-accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--color-accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </div>
        <div style="flex:1;">
          <div style="font-weight:700;font-size:var(--text-sm);color:var(--color-accent);">ZENについて</div>
          <div style="font-size:var(--text-xs);color:var(--color-text-secondary);margin-top:2px;">監修者プロフィール・アプリ開発の背景</div>
        </div>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </a>
    </section>

    <!-- プレミアムリンク -->
    <div style="text-align:center;padding:var(--sp-2) 0 var(--sp-4);">
      <a href="zen_hikiyose_premium.html" class="btn-text" style="font-size:var(--text-xs);">プレミアムプランの詳細を見る</a>
    </div>

  </main>

  <!-- ボトムナビ -->
  <nav class="bottom-nav">
    <a href="zen_hikiyose_home.html" class="bottom-nav__item is-active">
      <span class="bottom-nav__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>
      <span class="bottom-nav__label">ホーム</span>
    </a>
    <a href="zen_hikiyose_affirmation.html" class="bottom-nav__item">
      <span class="bottom-nav__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="8" y1="22" x2="16" y2="22"/></svg></span>
      <span class="bottom-nav__label">アファメーション</span>
    </a>
    <a href="zen_hikiyose_log.html" class="bottom-nav__item">
      <span class="bottom-nav__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg></span>
      <span class="bottom-nav__label">ログ</span>
    </a>
    <a href="zen_hikiyose_roadmap.html" class="bottom-nav__item">
      <span class="bottom-nav__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/><line x1="9" y1="3" x2="9" y2="18"/><line x1="15" y1="6" x2="15" y2="21"/></svg></span>
      <span class="bottom-nav__label">マップ</span>
    </a>
    <a href="zen_hikiyose_settings.html" class="bottom-nav__item">
      <span class="bottom-nav__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span>
      <span class="bottom-nav__label">設定</span>
    </a>
  </nav>

</div>
<div id="toast-container" class="toast-container"></div>

<script type="module">
  import ZenStorage from '../js/zen_hikiyose_storage.js';
  import ZenScore from '../js/zen_hikiyose_score.js';
  import ZenApp from '../js/zen_hikiyose_app.js';

  ZenApp.init();

  // スコア表示
  const score = ZenScore.getCurrentScore();
  document.getElementById('score-value').textContent = score;
  document.getElementById('score-stat').textContent = score;
  document.getElementById('streak-val').textContent = ZenScore.getStreak();
  document.getElementById('total-val').textContent = ZenScore.getTotalDays();

  // 今日の実施状況
  const dl = ZenScore.getDailyLog();
  if (dl.morning) document.getElementById('morning-status').textContent = '完了';
  if (dl.evening) document.getElementById('evening-status').textContent = '完了';

  // 今日のアドバイス
  fetch('../data/zen_hikiyose_advice.json')
    .then(r => r.json())
    .then(data => {
      const day = new Date().getDate();
      const item = data.advice[(day - 1) % data.advice.length];
      document.getElementById('daily-advice').innerHTML = `
        <p style="font-size:var(--text-xs);color:var(--color-accent);font-weight:700;letter-spacing:0.08em;margin-bottom:10px;">${item.title}</p>
        <p style="font-size:var(--text-sm);color:var(--color-text-sub);line-height:1.8;">${item.body}</p>
        <div style="margin-top:12px;text-align:right;">
          <a href="zen_hikiyose_advice.html" style="font-size:var(--text-xs);color:var(--color-text-muted);">すべて見る</a>
        </div>
      `;
    })
    .catch(() => {
      document.getElementById('daily-advice').innerHTML = '<p style="color:var(--color-text-sub);font-size:var(--text-sm);">今日も実践を続けましょう。</p>';
    });
</script>
</body>
</html>
