<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#D4AF37">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>MINDFUL ASSET - ロードマップ</title>
  <link rel="stylesheet" href="../css/zen_hikiyose_theme.css">
  <link rel="stylesheet" href="../css/zen_hikiyose_base.css">
  <link rel="stylesheet" href="../css/zen_hikiyose_components.css">
  <style>
    .course-card {
      background: var(--color-bg-card);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      overflow: hidden;
      margin-bottom: var(--sp-3);
    }
    .course-header {
      padding: var(--sp-4);
      display: flex;
      align-items: flex-start;
      gap: var(--sp-3);
      cursor: pointer;
    }
    .course-num {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--color-accent-dim);
      border: 1.5px solid var(--color-accent-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: var(--text-xs);
      font-weight: 900;
      color: var(--color-accent);
      flex-shrink: 0;
    }
    .course-num--locked {
      background: var(--color-bg-elevated);
      border-color: var(--color-border);
      color: var(--color-text-muted);
    }
    .course-info { flex: 1; }
    .course-name { font-weight: 700; font-size: var(--text-sm); margin-bottom: 4px; }
    .course-desc { font-size: var(--text-xs); color: var(--color-text-muted); line-height: 1.6; }
    .course-meta { display: flex; align-items: center; gap: var(--sp-2); margin-top: 6px; }
    .course-days { font-size: var(--text-xs); color: var(--color-text-muted); }
    .course-steps { padding: 0 var(--sp-4) var(--sp-4); border-top: 1px solid var(--color-border); }
    .step-item { display: flex; gap: var(--sp-3); padding: var(--sp-3) 0; border-bottom: 1px solid var(--color-border); align-items: flex-start; }
    .step-item:last-child { border-bottom: none; }
    .step-day { font-size: var(--text-xs); color: var(--color-accent); font-weight: 700; min-width: 40px; padding-top: 1px; }
    .step-content { flex: 1; }
    .step-title { font-size: var(--text-sm); font-weight: 500; }
    .step-detail { font-size: var(--text-xs); color: var(--color-text-muted); margin-top: 3px; line-height: 1.5; }
    .progress-wrap { padding: 0 var(--sp-4) var(--sp-3); }
  </style>
</head>
<body>
<div id="app">

  <header class="page-header">
    <span class="page-header__title">ロードマップ</span>
    <a href="zen_hikiyose_mandala.html" style="font-size:var(--text-xs);color:var(--color-text-muted);">マンダラマップ</a>
  </header>

  <main class="main-content">
    <p style="font-size:var(--text-xs);color:var(--color-text-muted);margin-bottom:var(--sp-4);line-height:1.7;">
      段階的なコースを通じて思考の質を引き上げます。無料版はコース01のみ解放されています。
    </p>
    <div id="course-list">
      <div class="spinner"></div>
    </div>
  </main>

  <!-- ボトムナビ -->
  <nav class="bottom-nav">
    <a href="zen_hikiyose_home.html" class="bottom-nav__item">
      <span class="bottom-nav__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>
      <span class="bottom-nav__label">ホーム</span>
    </a>
    <a href="zen_hikiyose_affirmation.html" class="bottom-nav__item">
      <span class="bottom-nav__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="8" y1="22" x2="16" y2="22"/></svg></span>
      <span class="bottom-nav__label">アファメーション</span>
    </a>
    <a href="zen_hikiyose_log.html" class="bottom-nav__item">
      <span class="bottom-nav__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg></span>
      <span class="bottom-nav__label">ログ</span>
    </a>
    <a href="zen_hikiyose_roadmap.html" class="bottom-nav__item is-active">
      <span class="bottom-nav__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/><line x1="9" y1="3" x2="9" y2="18"/><line x1="15" y1="6" x2="15" y2="21"/></svg></span>
      <span class="bottom-nav__label">マップ</span>
    </a>
    <a href="zen_hikiyose_settings.html" class="bottom-nav__item">
      <span class="bottom-nav__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span>
      <span class="bottom-nav__label">設定</span>
    </a>
  </nav>

</div>

<script type="module">
  import ZenStorage from '../js/zen_hikiyose_storage.js';
  import ZenScore from '../js/zen_hikiyose_score.js';
  import ZenPremium from '../js/zen_hikiyose_premium.js';
  import ZenApp from '../js/zen_hikiyose_app.js';

  ZenApp.init();

  const isPremium = ZenPremium.isPremium();
  const progress = ZenStorage.get('zen_hikiyose_roadmap_progress', {});
  let openCourseId = null;

  fetch('../data/zen_hikiyose_roadmap.json')
    .then(r => r.json())
    .then(data => {
      const container = document.getElementById('course-list');
      container.innerHTML = data.courses.map((course, i) => {
        const isAvailable = course.is_free || isPremium;
        const prog = progress[course.id] || { completedDays: [] };
        const pct = course.steps.length > 0 ? Math.round((prog.completedDays.length / course.steps.length) * 100) : 0;
        const numClass = isAvailable ? '' : 'course-num--locked';

        return `
          <div class="course-card" id="card-${course.id}">
            <div class="course-header" onclick="toggleCourse('${course.id}', ${i}, ${isAvailable})">
              <div class="course-num ${numClass}">${String(i + 1).padStart(2, '0')}</div>
              <div class="course-info">
                <div class="course-name${isAvailable ? '' : '" style="color:var(--color-text-muted)'}">${course.name}</div>
                <div class="course-desc">${course.description}</div>
                <div class="course-meta">
                  <span class="course-days">${course.duration_days}日間</span>
                  <span class="${isAvailable ? 'badge badge-free' : 'badge badge-premium'}">${isAvailable ? '解放済み' : 'プレミアム'}</span>
                </div>
              </div>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="icon-${course.id}"><polyline points="6 9 12 15 18 9"/></svg>
            </div>
            ${isAvailable && course.steps.length > 0 ? `
              <div class="progress-wrap">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
                  <span style="font-size:var(--text-xs);color:var(--color-text-muted);">進捗</span>
                  <span style="font-size:var(--text-xs);color:var(--color-accent);font-weight:700;">${pct}%</span>
                </div>
                <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
              </div>
            ` : ''}
            <div class="course-steps hidden" id="steps-${course.id}">
              ${isAvailable ? renderSteps(course, prog) : `
                <div style="padding:var(--sp-4);text-align:center;">
                  <p style="font-size:var(--text-sm);color:var(--color-text-muted);margin-bottom:var(--sp-3);">このコースはプレミアムプランで解放されます</p>
                  <a href="zen_hikiyose_premium.html" class="btn-primary btn-sm btn-auto" style="display:inline-flex;padding:9px 20px;">プレミアムで解放する</a>
                </div>
              `}
            </div>
          </div>
        `;
      }).join('');
    });

  function renderSteps(course, prog) {
    if (!course.steps || course.steps.length === 0) {
      return '<p style="padding:var(--sp-4);font-size:var(--text-sm);color:var(--color-text-muted);text-align:center;">コンテンツ準備中です</p>';
    }
    return `<div style="padding-top:var(--sp-2);">` + course.steps.map(s => {
      const done = prog.completedDays && prog.completedDays.includes(s.day);
      return `
        <div class="step-item">
          <div class="step-day">DAY ${s.day}</div>
          <div class="step-content">
            <div class="step-title${done ? '" style="text-decoration:line-through;color:var(--color-text-muted)' : ''}">${s.title}</div>
            <div class="step-detail">${s.detail}</div>
          </div>
          <button onclick="markStep('${course.id}', ${s.day})" style="font-size:20px;background:none;border:none;cursor:pointer;color:${done ? 'var(--color-success)' : 'var(--color-border)'};">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="${done ? 'var(--color-success)' : 'none'}" stroke="${done ? 'var(--color-success)' : 'var(--color-border)'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/>${done ? '<polyline points="9 12 11 14 15 10"/>' : ''}</svg>
          </button>
        </div>
      `;
    }).join('') + '</div>';
  }

  window.toggleCourse = (id, idx, isAvailable) => {
    const steps = document.getElementById(`steps-${id}`);
    const icon = document.getElementById(`icon-${id}`);
    const isOpen = !steps.classList.contains('hidden');
    if (isOpen) {
      steps.classList.add('hidden');
      icon.style.transform = '';
    } else {
      steps.classList.remove('hidden');
      icon.style.transform = 'rotate(180deg)';
    }
  };

  window.markStep = (courseId, day) => {
    const prog = ZenStorage.get('zen_hikiyose_roadmap_progress', {});
    if (!prog[courseId]) prog[courseId] = { completedDays: [] };
    const idx = prog[courseId].completedDays.indexOf(day);
    if (idx === -1) {
      prog[courseId].completedDays.push(day);
      ZenScore.addPoints('roadmap');
    } else {
      prog[courseId].completedDays.splice(idx, 1);
    }
    ZenStorage.set('zen_hikiyose_roadmap_progress', prog);
    location.reload();
  };
</script>
</body>
</html>
