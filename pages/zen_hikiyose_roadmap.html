<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#D4AF37">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>MINDFUL ASSET - ロードマップ</title>
  <link rel="stylesheet" href="../css/zen_hikiyose_theme.css">
  <link rel="stylesheet" href="../css/zen_hikiyose_base.css">
  <link rel="stylesheet" href="../css/zen_hikiyose_components.css">
</head>
<body>
  <div id="app">
    <header class="page-header">
      <span class="page-header-title">ロードマップ</span>
    </header>

    <main class="main-content">
      <p class="page-subtitle">段階的なコースで引き寄せ力を高めましょう</p>
      <div id="course-list" style="display:flex;flex-direction:column;gap:16px;">
        <div class="spinner"></div>
      </div>
    </main>

    <nav class="bottom-nav">
      <a href="zen_hikiyose_home.html" class="bottom-nav-item">
        <span class="nav-icon">🏠</span><span class="nav-label">ホーム</span>
      </a>
      <a href="zen_hikiyose_affirmation.html" class="bottom-nav-item">
        <span class="nav-icon">🔥</span><span class="nav-label">アファメーション</span>
      </a>
      <a href="zen_hikiyose_log.html" class="bottom-nav-item">
        <span class="nav-icon">📓</span><span class="nav-label">ログ</span>
      </a>
      <a href="zen_hikiyose_roadmap.html" class="bottom-nav-item active">
        <span class="nav-icon">🗺️</span><span class="nav-label">マップ</span>
      </a>
      <a href="zen_hikiyose_settings.html" class="bottom-nav-item">
        <span class="nav-icon">⚙️</span><span class="nav-label">設定</span>
      </a>
    </nav>
  </div>

  <script type="module">
    import ZenStorage from '../js/zen_hikiyose_storage.js';
    import ZenPremium from '../js/zen_hikiyose_premium.js';

    const theme = ZenStorage.get('theme', 'default');
    if (theme && theme !== 'default') document.documentElement.setAttribute('data-theme', theme);

    fetch('../data/zen_hikiyose_roadmap.json')
      .then(r => r.json())
      .then(data => {
        const isPremium = ZenPremium.isPremium();
        const container = document.getElementById('course-list');
        container.innerHTML = data.courses.map(course => {
          const locked = course.is_premium && !isPremium;
          return `
            <div class="${locked ? 'card' : 'card card-premium'}" style="opacity:${locked ? 0.7 : 1};">
              <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;">
                <div>
                  <p style="font-weight:700;font-size:1rem;color:${locked ? 'var(--color-text-secondary)' : 'var(--color-accent)'};">${course.title}</p>
                  <p class="text-muted text-xs" style="margin-top:4px;">${course.duration_days}日間プログラム</p>
                </div>
                <span class="${locked ? 'badge badge-premium' : 'badge badge-free'}">${locked ? 'PREMIUM' : 'FREE'}</span>
              </div>
              <p class="text-sm" style="color:var(--color-text-secondary);margin-bottom:12px;">${course.description}</p>
              ${locked
                ? `<a href="zen_hikiyose_premium.html" class="btn btn-secondary btn-sm">ロック解除</a>`
                : `<button class="btn btn-primary btn-sm">コースを開始する</button>`
              }
            </div>
          `;
        }).join('');
      });
  </script>
</body>
</html>
